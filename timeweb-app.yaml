# Конфигурация для TimeWeb App Platform
# Этот файл поможет при настройке в панели управления

app_name: FountainBistro
app_type: dotnet
app_version: 8.0

# Переменные окружения
environment_variables:
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: ASPNETCORE_URLS
    value: http://+:8080
  - name: ConnectionStrings__DefaultConnection
    value: Data Source=/app/Data/FountainBistro.db

# Настройки ресурсов
resources:
  cpu: 0.5
  memory: 512

# Настройки масштабирования
scaling:
  min_replicas: 1
  max_replicas: 1
  target_cpu_utilization: 70

# Health check
health_check:
  path: /health
  interval: 30
  timeout: 5
  unhealthy_threshold: 3
  healthy_threshold: 2

# Порты
ports:
  - protocol: http
    port: 8080
    target_port: 8080
